name: Generate Pacman Animation

on:
  schedule:
    - cron: "0 0 * * * "
  workflow_dispatch:
    push:
      branches: [ main ]

jobs:
  generate: 
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Generate pacman sontribution graph
        uses: :Platane/snl@v3
        with:
          github_user_name: ${{github.repository_owner}}
          outputs:
            dist/pacman-contribution-graph-dark.svg?palette=github-dark
            dist/pacman-contribution-graph-light.svg?palette=github-dark

      - name: Push generated SVG  files to the 'output' branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
